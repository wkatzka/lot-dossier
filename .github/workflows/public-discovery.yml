name: Public record discovery
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Bounded worker minutes (1–20)
        default: '20'
        required: false
      profile:
        description: Optional reviewed profile ID (blank runs all)
        default: ''
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: public-record-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y antiword poppler-utils
      - name: Restore latest durable checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .discovery-state
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=discovery-metadata&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$artifact" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > /tmp/discovery-state.zip
            unzip -q /tmp/discovery-state.zip -d .discovery-state
          fi
      - name: Process bounded discovery batch
        run: node scripts/run-discovery-production.js
        env:
          DISCOVERY_MINUTES: ${{ inputs.minutes || '20' }}
          DISCOVERY_PROFILE: ${{ inputs.profile || '' }}
      - name: Compact source bytes out of checkpoint
        if: always()
        run: node scripts/compact-discovery-checkpoint.js .discovery-state
      - name: Preserve checkpoint even after a failed batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-metadata
          path: .discovery-metadata/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Publish sanitized discovery evidence
        run: |
          git config user.name 'Cornerpin discovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/title/discovery-index.json data/title/discovery-production.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public discovery evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
